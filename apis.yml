name: Tremor
description: >-
  Tremor Technologies operated a programmatic "smart market" for wholesale risk
  and reinsurance, applying intelligent market design, auction technology, and
  optimization to match risk with capital and price and place reinsurance
  contracts far faster and cheaper than traditional negotiated markets. Founded
  in 2016 by Sean Bourgeois and later based in Greenwich, Connecticut, the
  platform ran auction-style placements for insurers, brokers, reinsurers, ILS
  funds, and Lloyd's syndicates, and added Tremor Wordings to digitize contract
  negotiation. Backed by Anthemis (lead), W. R. Berkley, Nephila Capital, and
  Markel, Tremor's assets were sold to W. R. Berkley Corporation in September
  2023 and the standalone public marketplace site (tremor.co) is no longer live.
